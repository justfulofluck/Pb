<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greenboard Texture</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            /* 🎯 base green */
            background: #0b3d2e;
            position: relative;
            color: white;
            overflow: hidden;
        }


        /* 🎯 REALISTIC TEXTURE (SVG noise) */
        body::after {
            content: "";
            position: absolute;
            inset: 0;

            background-image: url("data:image/svg+xml,\
    <svg xmlns='http://www.w3.org/2000/svg'>\
      <filter id='noise'>\
        <feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/>\
        <feColorMatrix type='saturate' values='0'/>\
      </filter>\
      <rect width='100%' height='100%' filter='url(%23noise)' opacity='0.4'/>\
    </svg>");

            mix-blend-mode: overlay;
            opacity: 0.15;
            pointer-events: none;
        }

        /* ✨ WHITE MICRO SPECKLES (KEY PART) */
        .speckles {
            position: absolute;
            inset: 0;
            pointer-events: none;

            background-image:
                radial-gradient(white 0.5px, transparent 0.5px);

            background-size: 3px 3px;
            /* tiny dots */
            opacity: 0.05;
            mix-blend-mode: soft-light;
        }

        h1 {
            position: relative;
            z-index: 2;
            font-size: 64px;
            font-weight: 800;
        }
    </style>
</head>

<body>

    <div class="speckles"></div>

    <h1>Affordable Plans</h1>

</body>

</html>
