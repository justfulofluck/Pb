{% extends "emails/base_email.html" %}

{% block content %}
<h1 style="color: #008a45; font-size: 28px; margin-bottom: 20px;">New Article Alert! 🚀</h1>

{% if instance.image %}
<img src="{{ instance.image }}" alt="{{ instance.title }}"
    style="width: 100%; border-radius: 12px; margin-bottom: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
{% endif %}

<h2 style="color: #0b3d2e; font-size: 24px; margin-bottom: 15px;">{{ instance.title }}</h2>

<p style="line-height: 1.8; color: #555555; margin-bottom: 30px; font-size: 16px;">
    {{ instance.excerpt }}
</p>

<div style="text-align: center;">
    <a href="{{ blog_link }}" class="button">Read Full Article</a>
</div>

<div class="divider"></div>

<p style="font-size: 12px; color: #999999; text-align: center;">
    You received this email because you subscribed to Pinobite newsletter.<br>
    <a href="{{ blog_url }}/unsubscribe?email={{ email }}"
        style="color: #008a45; text-decoration: none;">Unsubscribe</a> | <a href="{{ blog_url }}"
        style="color: #008a45; text-decoration: none;">Visit Website</a>
</p>

{% endblock %}
