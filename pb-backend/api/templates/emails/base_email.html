<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #f2f2ec;
            margin: 0;
            padding: 0;
            color: #333333;
        }

        .wrapper {
            width: 100%;
            background-color: #f2f2ec;
            padding-bottom: 40px;
        }

        .main {
            background-color: #ffffff;
            margin: 0 auto;
            width: 100%;
            max-width: 600px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border-spacing: 0;
        }

        .header {
            background-color: #008a45;
            padding: 40px 20px;
            text-align: center;
        }

        .logo {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ffffff;
            text-decoration: none;
        }

        .logo span {
            color: #f9bc15;
        }

        .content {
            padding: 40px 30px;
        }

        .button {
            display: inline-block;
            background-color: #008a45;
            color: #ffffff !important;
            padding: 15px 35px;
            text-decoration: none;
            font-weight: 800;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 20px 0;
        }

        .footer {
            background-color: #0b3d2e;
            padding: 40px 20px;
            text-align: center;
            font-size: 12px;
            color: #f2f2ec;
        }

        .footer a {
            color: #f9bc15;
            text-decoration: none;
        }

        .divider {
            border-top: 1px solid #eeeeee;
            margin: 25px 0;
        }

        .highlight-box {
            background-color: #f0fdf4;
            border: 1px solid #dcfce7;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <table class="main" align="center" border="0" cellpadding="0" cellspacing="0" width="600">
            <tr>
                <td class="header">
                    <a href="https://pinobite.com" class="logo">Pino<span>bite</span></a>
                </td>
            </tr>
            <tr>
                <td class="content">
                    {% block content %}{% endblock %}
                </td>
            </tr>
            <tr>
                <td class="footer">
                    <p>Follow the journey: <a href="https://www.instagram.com/pino.bite/">Instagram</a> | <a
                            href="https://www.facebook.com/profile.php?id=61574254086582">Facebook</a></p>
                    <p>&copy; 2026 Pinobite Global. All rights reserved.</p>
                    <p>Mumbai, India | hello@pinobite.global</p>
                </td>
            </tr>
        </table>
    </div>
</body>

</html>
